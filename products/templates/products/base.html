{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Product Catalog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'products/vendor/bootstrap/bootstrap.min.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'products/vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
