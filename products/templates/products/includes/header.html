<header class="d-flex align-items-center justify-content-between gap-3 border-bottom pb-3 mb-4">
    <div class="d-flex align-items-center gap-2">
    <a href="{% url 'products:dashboard' %}" class="brand text-decoration-none">
        <span class="brand-monogram" aria-hidden="true">MI</span>
        <span class="brand-copy">
            <span class="brand-label">Assignment</span>
            <span class="brand-name">Masoud Imanpour<span class="brand-dot">.</span></span>
        </span>
    </a>
    <button type="button" id="contact-info" class="contact-info-button" aria-label="Show Masoud Imanpour's contact information" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v2"/></svg>
    </button>
    </div>
    <template id="contact-content">
        <div class="contact-details">
            <div class="contact-row">
                <span class="contact-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span>
                <div><span class="contact-label">Email</span><span>imanpour@outlook.com</span></div>
            </div>
            <div class="contact-row">
                <span class="contact-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
                <div><span class="contact-label">Location</span><span>Vancouver, BC</span></div>
            </div>
            <div class="contact-row">
                <span class="contact-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a20 20 0 0 0 18 0M12 11v4"/></svg></span>
                <div><span class="contact-label">Current position</span><span>Senior Software Developer</span></div>
            </div>
        </div>
    </template>
    <div class="d-flex align-items-center gap-3">
        <a href="{% url 'products:dashboard' %}" class="badge rounded-pill text-bg-primary px-3 py-2 text-decoration-none">Dashboard</a>
        <a href="{% url 'products:management' %}" class="btn badge rounded-pill border-0 px-3 py-2 admin-button">Admin</a>
    </div>
</header>
